name: 💡 功能建议 / Feature Request
description: 提议一个新功能或改进 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！对于较大的功能，建议先开 [Discussion](https://github.com/hyhmrright/StockAI/discussions) 讨论。
        Thanks for the idea! For larger features, consider opening a [Discussion](https://github.com/hyhmrright/StockAI/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / The problem
      description: 这个功能解决了什么痛点？/ What pain point does this address?
      placeholder: "我希望能…因为…/ I wish I could… because…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望它怎么工作？/ How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 你考虑过哪些其他做法？/ Any alternatives you've considered?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、参考产品、使用场景等 / Screenshots, reference products, use cases
    validations:
      required: false
