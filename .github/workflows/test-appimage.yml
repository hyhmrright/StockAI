name: "Test AppImage Build (throwaway)"

# 一次性验证 ubuntu-24.04 上 AppImage 打包修复，手动触发，不发布任何产物。
# 验证通过后删除本文件，把修复合入 release.yml。
on:
  workflow_dispatch:

jobs:
  test-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ubuntu-22.04 默认 apparmor_restrict_unprivileged_userns=0，理论上不需放宽；
      # 若路径存在仍设为 0 兜底（不存在则跳过，不让步骤失败）。
      - name: Relax AppArmor unprivileged userns restriction (if present)
        run: |
          P=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$P" ]; then
            echo "before: $(cat $P)"
            echo 0 | sudo tee "$P"
            echo "after:  $(cat $P)"
          else
            echo "sysctl 不存在（22.04 预期如此），跳过"
          fi

      - name: Install frontend dependencies
        run: bun install

      - name: Build sidecar binary
        env:
          BUN_TARGET: bun-linux-x64
          OUTFILE: src-tauri/bin/stockai-backend-x86_64-unknown-linux-gnu
        run: |
          mkdir -p src-tauri/bin
          bun sidecar/build-script.ts

      # 预置较新的 linuxdeploy 到 Tauri 缓存，覆盖其内置的 2024-07 老版本。
      # 老版对 sidecar(Bun 大二进制)跑 ldd 失败会直接 abort；新版改为警告跳过。
      - name: Pre-seed newer linuxdeploy into tauri cache
        run: |
          mkdir -p ~/.cache/tauri
          curl -sSL --retry 5 -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage
          echo "预置版本:"
          APPIMAGE_EXTRACT_AND_RUN=1 ~/.cache/tauri/linuxdeploy-x86_64.AppImage --version 2>&1 | head -3 || true

      - name: Build deb + appimage (verbose)
        id: build
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --verbose --bundles deb,appimage

      # 抓 linuxdeploy 的真实 stderr（Tauri 吞掉了它，只剩 "failed to run linuxdeploy"）
      - name: Diagnose linuxdeploy failure
        if: steps.build.outcome == 'failure'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -x
          APPDIR_BASE=src-tauri/target/release/bundle/appimage
          echo "=== appimage 目录内容 ==="
          ls -laR "$APPDIR_BASE" || true
          echo "=== 找 linuxdeploy 二进制 ==="
          LD=$(find "$APPDIR_BASE" -name 'linuxdeploy*x86_64.AppImage' | head -n1)
          APPDIR=$(find "$APPDIR_BASE" -maxdepth 1 -name '*.AppDir' | head -n1)
          echo "linuxdeploy=$LD  appdir=$APPDIR"
          if [ -n "$LD" ] && [ -n "$APPDIR" ]; then
            chmod +x "$LD"
            echo "=== 手动运行 linuxdeploy 抓真实错误 ==="
            "$LD" --appdir "$APPDIR" --output appimage 2>&1 | tail -40 || echo "exit=$?"
          fi
          echo "=== 是否有 build_appimage 脚本 ==="
          find "$APPDIR_BASE" -name '*.sh' -exec echo '--- {} ---' \; -exec cat {} \; || true

      - name: Assert AppImage produced
        run: |
          echo "=== appimage bundle dir ==="
          ls -la src-tauri/target/release/bundle/appimage/ || true
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ 未生成 .AppImage"
            exit 1
          fi
          echo "✅ 生成 AppImage: $APPIMAGE"
          ls -la "$APPIMAGE"*
