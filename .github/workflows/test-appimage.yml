name: "Test AppImage Build (throwaway)"

# 一次性验证 ubuntu-24.04 上 AppImage 打包修复，手动触发，不发布任何产物。
# 验证通过后删除本文件，把修复合入 release.yml。
on:
  workflow_dispatch:

jobs:
  test-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ubuntu-22.04 默认 apparmor_restrict_unprivileged_userns=0，理论上不需放宽；
      # 若路径存在仍设为 0 兜底（不存在则跳过，不让步骤失败）。
      - name: Relax AppArmor unprivileged userns restriction (if present)
        run: |
          P=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$P" ]; then
            echo "before: $(cat $P)"
            echo 0 | sudo tee "$P"
            echo "after:  $(cat $P)"
          else
            echo "sysctl 不存在（22.04 预期如此），跳过"
          fi

      - name: Install frontend dependencies
        run: bun install

      - name: Build sidecar binary
        env:
          BUN_TARGET: bun-linux-x64
          OUTFILE: src-tauri/bin/stockai-backend-x86_64-unknown-linux-gnu
        run: |
          mkdir -p src-tauri/bin
          bun sidecar/build-script.ts

      - name: Build deb + appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun tauri build --bundles deb,appimage

      - name: Assert AppImage produced
        run: |
          echo "=== appimage bundle dir ==="
          ls -la src-tauri/target/release/bundle/appimage/ || true
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ 未生成 .AppImage"
            exit 1
          fi
          echo "✅ 生成 AppImage: $APPIMAGE"
          ls -la "$APPIMAGE"*
